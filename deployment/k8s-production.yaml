# Production Kubernetes Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm-production
  namespace: anythingllm-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anythingllm-production
  template:
    metadata:
      labels:
        app: anythingllm-production
    spec:
      containers:
      - name: anythingllm
        image: ghcr.io/anythingllm/anythingllm:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: ANYTHING_LLM_RUNTIME
          value: "docker"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: anythingllm-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm-production-service
  namespace: anythingllm-production
spec:
  selector:
    app: anythingllm-production
  ports:
  - port: 80
    targetPort: 3001
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anythingllm-production-ingress
  namespace: anythingllm-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - anythingllm.com
    secretName: anythingllm-tls
  rules:
  - host: anythingllm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: anythingllm-production-service
            port:
              number: 80
